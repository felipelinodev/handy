name: Build and Deploy NestJS Backend

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'src/backend/handy-backend-nest/**'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'src/backend/handy-backend-nest/**'

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        # Define o diretório de trabalho para os comandos run
        working-directory: src/backend/handy-backend-nest

    strategy:
      matrix:
        node-version: [22.x] # Simplificado para focar na versão principal se for deploy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          # Especifica o caminho do package-lock.json para o cache
          cache-dependency-path: src/backend/handy-backend-nest/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Linter
        run: npm run lint

      - name: Run Tests
        run: npm run test

      - name: Build Application
        run: npm run build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Garante que o deploy só aconteça se for um push/merge na branch principal (não em PRs)
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # O script abaixo será executado diretamente na sua máquina EC2
          script: |
            cd ${{ secrets.PROJECT_PATH }}
            
            # Baixa as atualizações do repositório
            git pull origin main
            
            # Entra na pasta do backend
            cd src/backend/handy-backend-nest
            
            # Instala as dependências e gera o prisma
            npm install
            npx prisma generate
            
            # Faz o build do projeto
            npm run build
            
            # Reinicia a aplicação (exemplo com PM2, adapte caso use Docker ou outro gerenciador)
            # pm2 restart api-handy
